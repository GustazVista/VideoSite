<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A little surprise for you 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<!-- Confetti library (needs internet when you open the file) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>

<style>
  /* ---------- Colour tokens: strawberry-milk palette ---------- */
  :root {
    --ink:      #5c1f35;   /* deep berry text */
    --raspberry:#e8386d;   /* main accent */
    --rose:     #ff7a9e;   /* soft accent */
    --blush:    #ffd6e2;   /* borders / tints */
    --milk:     #fff4f7;   /* page background */
    --card:     #ffffff;
    --shadow:   0 14px 40px rgba(232, 56, 109, .18);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 20% 10%, #ffe3ec 0, transparent 45%),
                radial-gradient(circle at 85% 90%, #ffc9d9 0, transparent 50%),
                var(--milk);
    background-attachment: fixed;
  }
  h1, h2, .btn-surprise { font-family: "Fredoka", "Nunito", sans-serif; }

  /* ---------- 1. Landing / gate ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center; text-align: center; padding: 24px;
    background: radial-gradient(circle at 50% 40%, #ff5c8a 0, #c2185b 55%, #7a0f3d 100%);
    transition: opacity .9s ease, visibility .9s;
  }
  #gate.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #gate p { color: #ffe3ec; margin-bottom: 28px; font-weight: 600; font-size: 1.1rem; }
  .btn-surprise {
    font-size: clamp(2rem, 8vw, 3.4rem); font-weight: 700; letter-spacing: .04em;
    color: var(--raspberry); background: #fff; border: 0; cursor: pointer;
    padding: .55em 1.3em; border-radius: 999px;
    box-shadow: 0 0 0 8px rgba(255,255,255,.25), 0 18px 40px rgba(0,0,0,.3);
    animation: pulse 1.8s ease-in-out infinite;
    transition: transform .2s;
  }
  .btn-surprise:hover { transform: scale(1.06) rotate(-2deg); }
  .btn-surprise:focus-visible { outline: 4px solid #ffe3ec; outline-offset: 6px; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 18px rgba(255,255,255,.12), 0 18px 40px rgba(0,0,0,.3); } }

  /* ---------- 2. Main content ---------- */
  main {
    max-width: 760px; margin: 0 auto; padding: 48px 20px 24px;
    opacity: 0; transform: translateY(16px);
    transition: opacity 1s ease .2s, transform 1s ease .2s;
  }
  main.show { opacity: 1; transform: none; }
  h1 { text-align: center; font-size: clamp(1.9rem, 6vw, 2.8rem); color: var(--raspberry); }
  .sub { text-align: center; margin: 8px 0 28px; }

  /* Video */
  .video-wrap {
    position: relative; aspect-ratio: 16 / 9; background: #3a1224;
    border-radius: 28px; overflow: hidden; box-shadow: var(--shadow);
    border: 6px solid #fff;
  }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play-overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(122, 15, 61, .25); border: 0; cursor: pointer;
    transition: opacity .3s;
  }
  .play-overlay span {
    width: 84px; height: 84px; border-radius: 50%; background: #fff; color: var(--raspberry);
    display: grid; place-items: center; font-size: 2rem; padding-left: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  .play-overlay.gone { opacity: 0; pointer-events: none; }
  .placeholder {   /* shown only if VIDEO_SRC is empty or fails to load */
    position: absolute; inset: 0; display: none; place-items: center; text-align: center;
    padding: 20px; color: #ffe3ec; background: #7a0f3d;
  }
  .placeholder.on { display: grid; }
  .placeholder code { background: rgba(255,255,255,.15); padding: 2px 8px; border-radius: 8px; }

  /* Messages */
  .messages { margin-top: 44px; }
  h2 { text-align: center; font-size: 1.7rem; }
  form { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  input[type=text] {
    flex: 1 1 220px; font: inherit; padding: 14px 20px; color: var(--ink);
    border: 2px solid var(--blush); border-radius: 999px; background: #fff; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type=text]:focus { border-color: var(--rose); box-shadow: 0 0 0 5px rgba(255,122,158,.2); }
  .btn-send {
    font: 700 1rem "Nunito", sans-serif; color: #fff; cursor: pointer; border: 0;
    padding: 14px 28px; border-radius: 999px; background: linear-gradient(135deg, var(--rose), var(--raspberry));
    box-shadow: 0 8px 20px rgba(232,56,109,.3); transition: transform .15s, box-shadow .15s;
  }
  .btn-send:hover { transform: translateY(-2px); }
  .btn-send:active { transform: scale(.96); }
  .btn-send:focus-visible, .mute:focus-visible, .play-overlay:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .thanks { text-align: center; height: 1.6em; margin-top: 12px; font-weight: 700; color: var(--raspberry); opacity: 0; }
  .thanks.pop { animation: pop 1.8s ease; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.6); } 15% { opacity: 1; transform: scale(1.15); } 30%, 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }

  ul { list-style: none; padding: 0; margin-top: 12px; display: grid; gap: 12px; }
  li {
    background: var(--card); border-radius: 20px 20px 20px 6px; padding: 14px 18px;
    box-shadow: 0 6px 18px rgba(232,56,109,.12); overflow-wrap: anywhere;
  }
  li.new { animation: drop .6s cubic-bezier(.3, 1.6, .5, 1); }
  li time { display: block; font-size: .78rem; opacity: .6; margin-top: 4px; }
  @keyframes drop { from { opacity: 0; transform: translateY(-14px) scale(.95); } }
  .empty { text-align: center; opacity: .65; margin-top: 14px; }

  footer { text-align: center; padding: 32px 20px 40px; font-size: .95rem; }
  footer b { color: var(--raspberry); }

  /* Music mute button (hidden until the surprise is clicked) */
  .mute {
    position: fixed; right: 16px; bottom: 16px; z-index: 5; width: 48px; height: 48px;
    border-radius: 50%; border: 0; background: #fff; font-size: 1.3rem; cursor: pointer;
    box-shadow: var(--shadow); display: none;
  }
  .mute.on { display: block; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: .01s !important; }
  }
</style>
</head>
<body>

<!-- ========== 1. GATE SCREEN ========== -->
<section id="gate">
  <div>
    <p>Somebody made something just for you 💌</p>
    <button class="btn-surprise" id="surpriseBtn">SURPRISE</button>
  </div>
</section>

<!-- ========== 2. MAIN CONTENT ========== -->
<main id="main" aria-live="polite">
  <h1>Happy to see you here 💖</h1>
  <p class="sub">Press play, then leave me a little note below.</p>

  <div class="video-wrap">
    <!--
      ╔══════════════════════════════════════════════════════════╗
      ║  YOUR VIDEO GOES HERE                                    ║
      ║  1. Put your video file (e.g. my-video.mp4) in the SAME  ║
      ║     folder as this HTML file.                            ║
      ║  2. Change VIDEO_SRC in the <script> below to its name   ║
      ║     (or paste a full https:// link to an .mp4).          ║
      ╚══════════════════════════════════════════════════════════╝
    -->
    <video id="video" controls playsinline preload="metadata"></video>
    <button class="play-overlay" id="playBtn" aria-label="Play video"><span>▶</span></button>
    <div class="placeholder" id="placeholder">
      <p>🎬 Your video goes here.<br>Set <code>VIDEO_SRC</code> in the script to your file name.</p>
    </div>
  </div>

  <section class="messages">
    <h2>Leave a message 💬</h2>
    <form id="form" autocomplete="off">
      <input type="text" id="msg" maxlength="200" placeholder="Write something sweet…" aria-label="Your message" required>
      <button class="btn-send" type="submit">Send 💌</button>
    </form>
    <p class="thanks" id="thanks">Sent with love! 💕</p>
    <ul id="list"></ul>
    <p class="empty" id="empty">No messages yet. Be the first!</p>
  </section>
</main>

<footer>Made with love <b>♥</b></footer>

<button class="mute" id="mute" aria-label="Mute music">🔊</button>
<audio id="music" loop></audio>

<script>
  /* =====================  SETTINGS — EDIT THESE  ===================== */
  const VIDEO_SRC  = "";   // e.g. "my-video.mp4" (file next to this HTML) or "https://.../video.mp4"
  const VIDEO_POSTER = ""; // optional cover image, e.g. "cover.jpg"
  const MUSIC_SRC  = "";   // optional background music, e.g. "song.mp3". Leave "" for no music.
  const MUSIC_VOLUME = 0.3; // 0 to 1
  const STORAGE_KEY = "surprise-messages"; // messages are saved in this browser only
  /* ================================================================== */

  const $ = id => document.getElementById(id);
  const gate = $("gate"), main = $("main"), video = $("video"), music = $("music");

  /* ---------- Video setup ---------- */
  if (VIDEO_SRC) {
    video.src = VIDEO_SRC;
    if (VIDEO_POSTER) video.poster = VIDEO_POSTER;
    video.addEventListener("error", () => $("placeholder").classList.add("on"));
  } else {
    $("placeholder").classList.add("on");
    $("playBtn").classList.add("gone");
  }
  $("playBtn").addEventListener("click", () => video.play());
  video.addEventListener("play",  () => { $("playBtn").classList.add("gone"); music.pause(); });
  video.addEventListener("pause", () => { if (!video.ended) $("playBtn").classList.remove("gone"); });
  video.addEventListener("ended", () => { $("playBtn").classList.remove("gone"); startMusic(); });

  /* ---------- Music ---------- */
  function startMusic() {
    if (!MUSIC_SRC || muted) return;
    music.play().catch(() => {});
  }
  let muted = false;
  if (MUSIC_SRC) { music.src = MUSIC_SRC; music.volume = MUSIC_VOLUME; }
  $("mute").addEventListener("click", () => {
    muted = !muted;
    $("mute").textContent = muted ? "🔇" : "🔊";
    $("mute").setAttribute("aria-label", muted ? "Unmute music" : "Mute music");
    muted ? music.pause() : (video.paused && startMusic());
  });

  /* ---------- 1. SURPRISE: confetti + reveal ---------- */
  const COLORS = ["#ff5c8a", "#ffb3c7", "#ffd166", "#9be7c4", "#8ecbff", "#c9a7ff", "#ff9f68"];

  $("surpriseBtn").addEventListener("click", e => {
    // Confetti starts at the button's position on screen
    const r = e.currentTarget.getBoundingClientRect();
    const origin = { x: (r.left + r.width / 2) / innerWidth, y: (r.top + r.height / 2) / innerHeight };

    if (window.confetti) {
      // Big burst from the button
      confetti({ particleCount: 160, spread: 360, startVelocity: 45, origin, colors: COLORS, ticks: 200, scalar: 1.1 });
      // Fireworks-style bursts across the screen
      [250, 500, 800].forEach(t => setTimeout(() => {
        confetti({ particleCount: 70, spread: 90, startVelocity: 40, angle: 60,  origin: { x: 0, y: .75 }, colors: COLORS });
        confetti({ particleCount: 70, spread: 90, startVelocity: 40, angle: 120, origin: { x: 1, y: .75 }, colors: COLORS });
      }, t));
    }

    // After ~1.3s, fade the gate away and reveal the main content
    setTimeout(() => {
      gate.classList.add("hide");
      main.classList.add("show");
      if (MUSIC_SRC) { $("mute").classList.add("on"); startMusic(); }
    }, 1300);
  });

  /* ---------- 2. Messages (saved in localStorage) ---------- */
  const list = $("list"), empty = $("empty");
  let messages = [];
  try { messages = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (_) {}

  function render(newId) {
    list.innerHTML = "";
    empty.style.display = messages.length ? "none" : "block";
    messages.forEach(m => {   // newest first (we unshift on submit)
      const li = document.createElement("li");
      li.textContent = m.text;                       // textContent keeps user input safe
      if (m.id === newId) li.classList.add("new");
      const t = document.createElement("time");
      t.textContent = new Date(m.id).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
      li.appendChild(t);
      list.appendChild(li);
    });
  }

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const text = $("msg").value.trim();
    if (!text) return;
    const msg = { id: Date.now(), text };
    messages.unshift(msg);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(messages)); } catch (_) {}
    $("msg").value = "";
    render(msg.id);

    // Success animation: "Sent!" pop + a few hearts of confetti
    const th = $("thanks"); th.classList.remove("pop"); void th.offsetWidth; th.classList.add("pop");
    if (window.confetti) {
      confetti({ particleCount: 30, spread: 70, startVelocity: 25, origin: { y: .8 }, colors: COLORS,
                 shapes: ["circle"], scalar: .8 });
    }
  });

  render();
</script>
</body>
</html>
