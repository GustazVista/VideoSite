    var ctx = canvas.getContext('2d');

    ctx.font = font;
    var size = ctx.measureText(text);
    var width = Math.ceil(size.actualBoundingBoxRight + size.actualBoundingBoxLeft);
    var height = Math.ceil(size.actualBoundingBoxAscent + size.actualBoundingBoxDescent);

    var padding = 2;
    var x = size.actualBoundingBoxLeft + padding;
    var y = size.actualBoundingBoxAscent + padding;
    width += padding + padding;
    height += padding + padding;

    canvas = new OffscreenCanvas(width, height);
    ctx = canvas.getContext('2d');
    ctx.font = font;
    ctx.fillStyle = color;

    ctx.fillText(text, x, y);

    var scale = 1 / scalar;

    return {
      type: 'bitmap',
      // TODO these probably need to be transfered for workers
      bitmap: canvas.transferToImageBitmap(),
      matrix: [scale, 0, 0, scale, -width * scale / 2, -height * scale / 2]
    };
  }

  module.exports = function() {
    return getDefaultFire().apply(this, arguments);
  };
  module.exports.reset = function() {
    getDefaultFire().reset();
  };
  module.exports.create = confettiCannon;
  module.exports.shapeFromPath = shapeFromPath;
  module.exports.shapeFromText = shapeFromText;
}((function () {
  if (typeof window !== 'undefined') {
    return window;
  }

  if (typeof self !== 'undefined') {
    return self;
  }

  return this || {};
})(), module, false));

// end source content

  window.confetti = module.exports;
}(window, {}));

</script>

<style>
  /* ---------- Colour tokens: clean blue / slate palette ---------- */
  :root {
    --ink:      #1f2937;   /* dark slate text */
    --accent:#2563eb;   /* main accent (blue) */
    --accent-soft: #60a5fa;   /* soft accent */
    --line:     #e2e8f0;   /* borders / tints */
    --bg:       #f8fafc;   /* page background */
    --card:     #ffffff;
    --shadow:   0 14px 40px rgba(15, 23, 42, .15);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 20% 10%, #e0ecff 0, transparent 45%),
                radial-gradient(circle at 85% 90%, #e2e8f0 0, transparent 50%),
                var(--bg);
    background-attachment: fixed;
  }
  h1, h2, .btn-surprise { font-family: "Rubik", "Nunito", sans-serif; }

  /* ---------- 1. Landing / gate ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center; text-align: center; padding: 24px;
    background: radial-gradient(circle at 50% 40%, #3b82f6 0, #1e40af 55%, #0f172a 100%);
    transition: opacity .9s ease, visibility .9s;
  }
  #gate.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #gate p { color: #dbeafe; margin-bottom: 28px; font-weight: 600; font-size: 1.1rem; }
  .btn-surprise {
    font-size: clamp(2rem, 8vw, 3.4rem); font-weight: 700; letter-spacing: .04em;
    color: var(--accent); background: #fff; border: 0; cursor: pointer;
    padding: .55em 1.3em; border-radius: 999px;
    box-shadow: 0 0 0 8px rgba(255,255,255,.25), 0 18px 40px rgba(0,0,0,.3);
    animation: pulse 1.8s ease-in-out infinite;
    transition: transform .2s;
  }
  .btn-surprise:hover { transform: scale(1.06) rotate(-2deg); }
  .btn-surprise:focus-visible { outline: 4px solid #dbeafe; outline-offset: 6px; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 18px rgba(255,255,255,.12), 0 18px 40px rgba(0,0,0,.3); } }

  /* ---------- 2. Main content ---------- */
  main {
    max-width: 760px; margin: 0 auto; padding: 48px 20px 24px;
    opacity: 0; transform: translateY(16px);
    transition: opacity 1s ease .2s, transform 1s ease .2s;
  }
  main.show { opacity: 1; transform: none; }
  h1 { text-align: center; font-size: clamp(1.9rem, 6vw, 2.8rem); color: var(--accent); }

  /* Developer note (text is set in DEVELOPER_NOTE in the script, so only the site owner can change it) */
  .dev-note {
    background: var(--card); border-radius: 22px; padding: 18px 22px;
    border-left: 6px solid var(--accent); box-shadow: var(--shadow);
  }
  .dev-note small { display: block; font-weight: 700; color: var(--accent); text-transform: uppercase;
                    letter-spacing: .08em; font-size: .75rem; margin-bottom: 6px; }
  .dev-note p { white-space: pre-line; overflow-wrap: anywhere; }

  /* Messages */
  .messages { margin-top: 36px; }
  h2 { text-align: center; font-size: 1.7rem; }
  form { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  input[type=text] {
    flex: 1 1 220px; font: inherit; padding: 14px 20px; color: var(--ink);
    border: 2px solid var(--line); border-radius: 999px; background: #fff; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type=text]:focus { border-color: var(--accent-soft); box-shadow: 0 0 0 5px rgba(96,165,250,.25); }
  .btn-send {
    font: 700 1rem "Nunito", sans-serif; color: #fff; cursor: pointer; border: 0;
    padding: 14px 28px; border-radius: 999px; background: linear-gradient(135deg, var(--accent-soft), var(--accent));
    box-shadow: 0 8px 20px rgba(37,99,235,.3); transition: transform .15s, box-shadow .15s;
  }
  .btn-send:hover { transform: translateY(-2px); }
  .btn-send:active { transform: scale(.96); }
  .btn-send:focus-visible, .mute:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .thanks { text-align: center; height: 1.6em; margin-top: 12px; font-weight: 700; color: var(--accent); opacity: 0; }
  .thanks.pop { animation: pop 1.8s ease; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.6); } 15% { opacity: 1; transform: scale(1.15); } 30%, 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }

  ul { list-style: none; padding: 0; margin-top: 12px; display: grid; gap: 12px; }
  li {
    background: var(--card); border-radius: 20px 20px 20px 6px; padding: 14px 18px;
    box-shadow: 0 6px 18px rgba(15,23,42,.08); overflow-wrap: anywhere;
  }
  li { position: relative; padding-right: 48px; }
  .del {
    position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: 0; border-radius: 50%;
    background: transparent; color: var(--ink); opacity: .45; font-size: 1.3rem; line-height: 1; cursor: pointer;
    transition: opacity .2s, background .2s;
  }
  .del:hover, .del:focus-visible { opacity: 1; background: var(--line); outline: none; }
  li.removing { opacity: 0; transform: translateX(24px); transition: opacity .25s, transform .25s; }
  li.new { animation: drop .6s cubic-bezier(.3, 1.6, .5, 1); }
  li time { display: block; font-size: .78rem; opacity: .6; margin-top: 4px; }
  @keyframes drop { from { opacity: 0; transform: translateY(-14px) scale(.95); } }
  .empty { text-align: center; opacity: .65; margin-top: 14px; }

  .note { text-align: center; font-size: .85rem; opacity: .65; margin-top: 10px; }
  .admin { margin-top: 40px; text-align: center; font-size: .85rem; opacity: .6; }
  .admin summary { cursor: pointer; }
  .admin form { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  .admin input { flex: 1 1 150px; font: inherit; padding: 8px 14px; border: 2px solid var(--line); border-radius: 999px; }
  .admin button { font: inherit; padding: 8px 16px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; cursor: pointer; }
  footer { text-align: center; padding: 32px 20px 40px; font-size: .95rem; }
  footer b { color: var(--accent); }

  /* Music mute button (hidden until the surprise is clicked) */
  .mute {
    position: fixed; right: 16px; bottom: 16px; z-index: 5; width: 48px; height: 48px;
    border-radius: 50%; border: 0; background: #fff; font-size: 1.3rem; cursor: pointer;
    box-shadow: var(--shadow); display: none;
  }
  .mute.on { display: block; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: .01s !important; }
  }
</style>
</head>
<body>

<!-- ========== 1. GATE SCREEN ========== -->
<section id="gate">
  <div>
    <p>Это сделано специально для тебя 🎁</p>
    <button class="btn-surprise" id="surpriseBtn">СЮРПРИЗ</button>
  </div>
</section>

<!-- ========== 2. MAIN CONTENT ========== -->
<main id="main" aria-live="polite">
    <!-- Заметка разработчика: текст меняется только в файле (DEVELOPER_NOTE в скрипте) -->
  <aside class="dev-note" id="devNote" hidden>
    <small>Заметка разработчика</small>
    <p id="devNoteText"></p>
  </aside>

  <section class="messages">
    <h2>Оставь сообщение</h2>
    <form id="form" autocomplete="off">
      <input type="text" id="msg" maxlength="200" placeholder="Напиши сообщение…" aria-label="Твоё сообщение" required>
      <button class="btn-send" type="submit">Отправить</button>
    </form>
    <p class="thanks" id="thanks">Сообщение отправлено! ✓</p>
    <ul id="list"></ul>
    <p class="empty" id="empty">Пока нет сообщений. Будь первым!</p>
    <p class="note" id="localNote" hidden>Сообщения сохраняются только на этом устройстве.</p>
  </section>

  <!-- Вход для владельца (виден только когда работает сервер): после входа появляются кнопки удаления -->
  <details class="admin" id="admin" hidden>
    <summary>Владелец</summary>
    <form id="loginForm">
      <input type="password" id="adminPass" placeholder="Пароль владельца" autocomplete="current-password" required>
      <button type="submit" id="loginBtn">Войти</button>
    </form>
    <p id="adminMsg"></p>
  </details>
</main>

<button class="mute" id="mute" aria-label="Выключить музыку">🔊</button>
<audio id="music" loop></audio>

<script>
  /* =====================  НАСТРОЙКИ — МЕНЯЙ ЗДЕСЬ  ===================== */
  // Заметка разработчика. Видна всем посетителям, но изменить её можно только
  // здесь, в коде (у посетителей на странице нет поля для её редактирования).
  // Оставь "" (пусто), чтобы скрыть заметку. \n = новая строка.
  const DEVELOPER_NOTE = "Привет! Это моя заметка. Измени этот текст в файле, и он обновится на странице.";

  // Сообщения общие для всех: они хранятся на сервере через /api/messages (см. папку api).
  // Если открыть файл просто с компьютера (без Vercel), сообщения хранятся только в браузере.
  const API_URL = "/api/messages";

  const MUSIC_SRC  = "";   // фоновая музыка (необязательно), например "song.mp3". "" = без музыки
  const MUSIC_VOLUME = 0.3; // громкость от 0 до 1
  const STORAGE_KEY = "surprise-messages"; // сообщения хранятся только в браузере посетителя
  /* ================================================================== */

  const $ = id => document.getElementById(id);
  const gate = $("gate"), main = $("main"), music = $("music");

  /* ---------- Developer note ---------- */
  if (DEVELOPER_NOTE.trim()) {
    $("devNoteText").textContent = DEVELOPER_NOTE;   // textContent = safe, no HTML injection
    $("devNote").hidden = false;
  }

  /* ---------- Music ---------- */
  function startMusic() {
    if (!MUSIC_SRC || muted) return;
    music.play().catch(() => {});
  }
  let muted = false;
  if (MUSIC_SRC) { music.src = MUSIC_SRC; music.volume = MUSIC_VOLUME; }
  $("mute").addEventListener("click", () => {
    muted = !muted;
    $("mute").textContent = muted ? "🔇" : "🔊";
    $("mute").setAttribute("aria-label", muted ? "Включить музыку" : "Выключить музыку");
    muted ? music.pause() : startMusic();
  });

  /* ---------- 1. SURPRISE: confetti + reveal ---------- */
  const COLORS = ["#3b82f6", "#93c5fd", "#ffd166", "#9be7c4", "#8ecbff", "#c9a7ff", "#ff9f68"];

  /* Fireworks: a rocket trail shoots up, then explodes into a round burst of sparks.
     Tweak ROCKETS for a longer/shorter show. */
  const FIREWORK_COLORS = [["#ffe27a", "#fff6c9"], ["#ffffff", "#d9f1ff"], ["#9be7ff", "#ffffff"],
                           ["#d9b8ff", "#ffffff"], ["#bfdbfe", "#ffffff"], ["#b8ffd9", "#ffffff"]];
  const ROCKETS = 14;

  function launchFireworks() {
    for (let i = 0; i < ROCKETS; i++) {
      setTimeout(() => {
        const x = 0.12 + Math.random() * 0.76;        // where it explodes (horizontal)
        const y = 0.12 + Math.random() * 0.35;        // where it explodes (height)
        const cols = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];

        // Rocket trail rising from the bottom
        confetti({ particleCount: 18, angle: 90, spread: 2, startVelocity: 55, gravity: 0.4,
                   decay: 0.9, ticks: 30, origin: { x, y: 1 }, colors: ["#fff3c4", "#ffd166", "#ffffff"],
                   shapes: ["circle"], scalar: 1.1, zIndex: 200 });

        // Explosion: bright ring of sparks + glittering stars
        setTimeout(() => {
          confetti({ particleCount: 110, spread: 360, startVelocity: 38, gravity: 0.6, decay: 0.93,
                     ticks: 110, origin: { x, y }, colors: cols, shapes: ["circle"], scalar: 1.5, zIndex: 200 });
          confetti({ particleCount: 30, spread: 360, startVelocity: 18, gravity: 0.5, decay: 0.92,
                     ticks: 90, origin: { x, y }, colors: ["#fff3c4", "#ffffff"], shapes: ["star"], scalar: 1.6, zIndex: 200 });
        }, 420);
      }, i * 230 + (i % 3) * 60);
    }
  }

  $("surpriseBtn").addEventListener("click", e => {
    // Confetti starts at the button's position on screen
    const r = e.currentTarget.getBoundingClientRect();
    const origin = { x: (r.left + r.width / 2) / innerWidth, y: (r.top + r.height / 2) / innerHeight };

    if (window.confetti) {
      // Big burst from the button
      confetti({ particleCount: 160, spread: 360, startVelocity: 45, origin, colors: COLORS, ticks: 200, scalar: 1.1 });
      // Fireworks show across the whole screen
      launchFireworks();
    }

    // After ~1.3s, fade the gate away and reveal the main content
    setTimeout(() => {
      gate.classList.add("hide");
      main.classList.add("show");
      if (MUSIC_SRC) { $("mute").classList.add("on"); startMusic(); }
    }, 1300);
  });

  /* ---------- 2. Сообщения ----------
     • Сервер работает (Vercel /api/messages) → сообщения общие, удалять может только владелец.
     • Сервера нет (файл открыт с компьютера) → сообщения только в этом браузере (localStorage). */
  const list = $("list"), empty = $("empty"), thanks = $("thanks");
  let cloud = false;            // true, когда сервер ответил
  let isOwner = false;          // можно ли показывать кнопки удаления
  let adminPass = "";
  try { adminPass = sessionStorage.getItem("adminPass") || ""; } catch (_) {}
  let messages = [];            // [{ id, text, time: Date }]
  let seen = null, lastSig = "", lastSent = 0;

  function render(newIds) {
    list.innerHTML = "";
    empty.style.display = messages.length ? "none" : "block";
    messages.forEach(m => {     // сначала новые
      const li = document.createElement("li");
      li.textContent = m.text;                       // textContent = безопасно
      if (newIds && newIds.has(m.id)) li.classList.add("new");
      const t = document.createElement("time");
      t.textContent = m.time.toLocaleString("ru-RU", { dateStyle: "medium", timeStyle: "short" });
      li.appendChild(t);
      if (isOwner) {                                 // кнопка удаления
        const del = document.createElement("button");
        del.className = "del"; del.textContent = "×";
        del.setAttribute("aria-label", "Удалить сообщение");
        del.addEventListener("click", () => {
          li.classList.add("removing");
          setTimeout(() => removeMessage(m), 250);
        });
        li.appendChild(del);
      }
      list.appendChild(li);
    });
  }

  function flash(text) {          // короткое сообщение под формой + анимация
    thanks.textContent = text;
    thanks.classList.remove("pop"); void thanks.offsetWidth; thanks.classList.add("pop");
  }

  async function api(method, body) {
    const r = await fetch(API_URL, {
      method,
      headers: { "Content-Type": "application/json", "x-admin-password": adminPass },
      body: body ? JSON.stringify(body) : undefined
    });
    if (!r.ok) throw new Error(String(r.status));
    return r.json();
  }

  /* ----- Режим сервера ----- */
  function adminUI() {
    $("admin").hidden = false;
    $("loginForm").style.display = isOwner ? "none" : "";
    $("adminMsg").innerHTML = "";
    if (isOwner) {
      const out = document.createElement("button");
      out.textContent = "Выйти"; out.type = "button";
      out.addEventListener("click", () => {
        adminPass = ""; try { sessionStorage.removeItem("adminPass"); } catch (_) {}
        load();
      });
      $("adminMsg").append("Вы вошли как владелец. ", out);
    }
  }

  async function load(first) {
    try {
      const d = await api("GET");
      cloud = true; isOwner = !!d.admin;
      messages = d.messages.map(m => ({ id: m.id, text: m.text, time: new Date(m.time) }));
      $("localNote").hidden = true;
      const sig = messages.map(m => m.id).join() + "|" + isOwner;
      if (sig === lastSig) return;                  // ничего не изменилось
      lastSig = sig;
      const fresh = new Set(seen ? messages.filter(m => !seen.has(m.id)).map(m => m.id) : []);
      seen = new Set(messages.map(m => m.id));
      adminUI(); render(fresh);
    } catch (_) { if (first) startLocal(); }
  }

  /* ----- Локальный режим ----- */
  function saveLocal() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(messages.map(m => ({ id: m.id, text: m.text })))); } catch (_) {}
  }
  function startLocal() {
    isOwner = true;             // на своём устройстве можно удалять свои сообщения
    try { messages = (JSON.parse(localStorage.getItem(STORAGE_KEY)) || []).map(m => ({ ...m, time: new Date(m.id) })); } catch (_) {}
    $("localNote").hidden = false;
    render();
  }

  function removeMessage(m) {
    if (cloud) { api("DELETE", { id: m.id }).then(() => load()).catch(() => { flash("Не удалось удалить"); render(); }); return; }
    messages = messages.filter(x => x.id !== m.id); saveLocal(); render();
  }

  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    adminPass = $("adminPass").value; $("adminPass").value = "";
    lastSig = ""; await load();
    if (isOwner) { try { sessionStorage.setItem("adminPass", adminPass); } catch (_) {} }
    else { adminPass = ""; $("adminMsg").textContent = "Неверный пароль"; }
  });

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const text = $("msg").value.trim();
    if (!text || Date.now() - lastSent < 4000) return;   // защита от спама
    lastSent = Date.now();
    $("msg").value = "";

    if (cloud) {
      try { await api("POST", { text }); flash("Сообщение отправлено! ✓"); load(); }
      catch (err) { flash(err.message === "429" ? "Подождите пару секунд" : "Не удалось отправить"); return; }
    } else {
      const m = { id: Date.now(), text, time: new Date() };
      messages.unshift(m); saveLocal(); render(new Set([m.id]));
      flash("Сообщение отправлено! ✓");
    }
    if (window.confetti) {
      confetti({ particleCount: 30, spread: 70, startVelocity: 25, origin: { y: .8 }, colors: COLORS,
                 shapes: ["circle"], scalar: .8 });
    }
  });

  load(true);
  setInterval(() => { if (cloud && !document.hidden) load(); }, 15000);   // подтягиваем новые сообщения
</script>
</body>
</html>
